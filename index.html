!DOCTYPE html>
<html>
    <head>
        <title>Survey Form</title>
        <link rel="stylesheet"
        href="style.css">
    </head>
    <body>
        <main>
            <h1>Feedback Survey Form</h1>
            <form id="survey-form">
            <label for="name">Name:

            </label>
            <input type="text" id="name"
            name ="name" required>
            <label for="email">Email:
                </label>
                <input type="email"
         id="email" name="email"required>
         <label for="age">Age:</label>
         <input type ="number" id="age"
          name="age" min="1" max="70">
         label>Rate Your Experience:</label><br>

<input type="radio" id="star5" name="rating" value="5">
<label for="star5">⭐⭐⭐⭐⭐</label><br>

<input type="radio" id="star4" name="rating" value="4">
<label for="star4">⭐⭐⭐⭐</label><br>

<input type="radio" id="star3" name="rating" value="3">
<label for="star3">⭐⭐⭐</label><br>

<input type="radio" id="star2" name="rating" value="2">
<label for="star2">⭐⭐</label><br>

<input type="radio" id="star1" name="rating" value="1">
<label for="star1">⭐</label>
            <textarea id="comments"
            name="comments" rows="4"></textarea>


            <button type="button" onclick="showMessage()">
            Submit Feedback

            </button>
            </form>
        </main>
        <script>
            function showMessage(){
                alert("Your Feedback has been Submitted!");
            }
        </script>
        </body>
        </html>
